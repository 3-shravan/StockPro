server.port=${GATEWAY_PORT:8080}
spring.application.name=api-gateway
spring.main.banner-mode=off

# ── Eureka Service Discovery ────────────────────────────────────────────────
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# ── JWT Secret (must match auth-service) ───────────────────────────────────
jwt.secret=${JWT_SECRET:4f6b6a6c6d6e6f707172737475767778797a3132333435363738393061626364}

# ── CORS (Handled centrally at Gateway level) ───────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ── Route Definitions ────────────────────────────────────────────────────────
# All routes follow /api/v1/service-name pattern
# We use StripPrefix=2 to remove /api/v1 before forwarding to downstream

# Auth Service — Public (login/register)
spring.cloud.gateway.routes[0].id=auth-service-public
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/login,/api/v1/auth/register
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[0].metadata.response-timeout=5000

# Auth Service — Secured
spring.cloud.gateway.routes[1].id=auth-service-secured
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[1].filters[1]=StripPrefix=2

# Product Service
spring.cloud.gateway.routes[2].id=product-service
spring.cloud.gateway.routes[2].uri=lb://product-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[2].filters[1]=StripPrefix=2

# Supplier Service
spring.cloud.gateway.routes[3].id=supplier-service
spring.cloud.gateway.routes[3].uri=lb://supplier-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/suppliers/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[3].filters[1]=StripPrefix=2

# Warehouse Service
spring.cloud.gateway.routes[4].id=warehouse-service
spring.cloud.gateway.routes[4].uri=lb://warehouse-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/warehouses/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[4].filters[1]=StripPrefix=2

# Purchase Service
spring.cloud.gateway.routes[5].id=purchase-service
spring.cloud.gateway.routes[5].uri=lb://purchase-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/purchase-orders/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[5].filters[1]=StripPrefix=2

# Movement Service
spring.cloud.gateway.routes[6].id=movement-service
spring.cloud.gateway.routes[6].uri=lb://movement-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/movements/**
spring.cloud.gateway.routes[6].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[6].filters[1]=StripPrefix=2

# Alert Service
spring.cloud.gateway.routes[7].id=alert-service
spring.cloud.gateway.routes[7].uri=lb://alert-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/alerts/**
spring.cloud.gateway.routes[7].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[7].filters[1]=StripPrefix=2

# ── Logging ────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.stockpro.gateway=DEBUG
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO

# ── Actuator ───────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=api-gateway
info.app.version=1.0.0
