server:
  port: ${GATEWAY_PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:api-gateway/.env[.properties]
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: "off"

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5173"
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
            allowed-headers: "*"
            allow-credentials: false
            max-age: 3600
      
      routes:
        # Auth Service — Public (login only; no public signup)
        - id: auth-service-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/login
          filters:
            - name: GatewaySecretFilter
            - StripPrefix=2
          metadata:
            response-timeout: 5000

        # Auth Service — Secured
        - id: auth-service-secured
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Product Service
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Supplier Service
        - id: supplier-service
          uri: lb://supplier-service
          predicates:
            - Path=/api/v1/suppliers/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Warehouse Service
        - id: warehouse-service
          uri: lb://warehouse-service
          predicates:
            - Path=/api/v1/warehouses/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Purchase Service
        - id: purchase-service
          uri: lb://purchase-service
          predicates:
            - Path=/api/v1/purchase-orders/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Movement Service
        - id: movement-service
          uri: lb://movement-service
          predicates:
            - Path=/api/v1/movements/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Alert Service
        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/v1/alerts/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Report Service
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

# ── JWT Secret (must match auth-service) ───────────────────────────────────
jwt:
  secret: ${JWT_SECRET:4f6b6a6c6d6e6f707172737475767778797a3132333435363738393061626364}

# ── Internal Gateway Security ──────────────────────────────────────────────
stockpro:
  security:
    internal-secret: ${INTERNAL_GATEWAY_SECRET:StockProGateway2024}

# ── Logging ────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.stockpro.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: INFO

# ── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: api-gateway
    version: 1.0.0
