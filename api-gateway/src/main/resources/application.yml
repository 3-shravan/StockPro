server:
  port: ${GATEWAY_PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:api-gateway/.env[.properties]
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: "off"

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5173"
              - "https://stock-pro-nine-eosin.vercel.app"
              - "${CORS_ALLOWED_ORIGIN:http://localhost:3000}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers:
              - "*"
            allow-credentials: false
            max-age: 3600
      
      routes:
        # Auth Service — Public (login only; no public signup)
        - id: auth-service-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/login
            - Method=POST
          filters:
            - name: GatewaySecretFilter
            - StripPrefix=2
          metadata:
            response-timeout: 5000

        # Auth Service — Secured
        - id: auth-service-secured
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
            - Method=GET,POST,PUT,DELETE,PATCH
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Product Service
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
            - Method=GET,POST,PUT,DELETE,PATCH
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Supplier Service
        - id: supplier-service
          uri: lb://supplier-service
          predicates:
            - Path=/api/v1/suppliers/**
            - Method=GET,POST,PUT,DELETE,PATCH
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Warehouse Service
        - id: warehouse-service
          uri: lb://warehouse-service
          predicates:
            - Path=/api/v1/warehouses/**
            - Method=GET,POST,PUT,DELETE,PATCH
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Purchase Service
        - id: purchase-service
          uri: lb://purchase-service
          predicates:
            - Path=/api/v1/purchase-orders/**
            - Method=GET,POST,PUT,DELETE,PATCH
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Movement Service
        - id: movement-service
          uri: lb://movement-service
          predicates:
            - Path=/api/v1/movements/**
            - Method=GET,POST,PUT,DELETE,PATCH
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Alert Service
        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/v1/alerts/**
            - Method=GET,POST,PUT,DELETE,PATCH
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # Report Service
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/reports/**
            - Method=GET,POST,PUT,DELETE,PATCH
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

# ── JWT Secret (must match auth-service) ───────────────────────────────────
jwt:
  secret: ${JWT_SECRET:your_jwt_secret_at_least_32_chars}

# ── Internal Gateway Security ──────────────────────────────────────────────
stockpro:
  security:
    internal-secret: ${INTERNAL_GATEWAY_SECRET:your_internal_gateway_secret}

# ── Logging ────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.stockpro.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: INFO

# ── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: api-gateway
    version: 1.0.0

# ── Springdoc / Swagger UI Aggregation ───────────────────────────────────────
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /api/v1/auth/v3/api-docs
      - name: Product Service
        url: /api/v1/products/v3/api-docs
      - name: Supplier Service
        url: /api/v1/suppliers/v3/api-docs
      - name: Warehouse Service
        url: /api/v1/warehouses/v3/api-docs
      - name: Purchase Service
        url: /api/v1/purchase-orders/v3/api-docs
      - name: Movement Service
        url: /api/v1/movements/v3/api-docs
      - name: Alert Service
        url: /api/v1/alerts/v3/api-docs
      - name: Report Service
        url: /api/v1/reports/v3/api-docs
