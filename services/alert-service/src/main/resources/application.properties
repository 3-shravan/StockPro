spring.config.import=optional:file:.env[.properties],optional:file:services/alert-service/.env[.properties]
spring.application.name=${APP_NAME:alert-service}
server.port=${SERVER_PORT:8087}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Eureka Discovery
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false


spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jackson.serialization.write-dates-as-timestamps=false

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.main.banner-mode=off

logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.apache=WARN
logging.level.com.zaxxer=WARN
logging.level.org.hibernate=WARN
logging.level.com.stockpro=INFO

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{1} : %msg%n
logging.pattern.file=%d{HH:mm:ss.SSS} %-5level %logger{1} : %msg%n

logging.file.name=logs/alert-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/alert-service-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=50MB

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0

alert.default.email.to=${ALERT_DEFAULT_EMAIL_TO:alerts@stockpro.local}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:noreply@stockpro.local}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.from=${MAIL_FROM:noreply@stockpro.local}

# --- Internal Service URLs ---
services.product.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.warehouse.url=${WAREHOUSE_SERVICE_URL:http://localhost:8083}
services.purchase.url=${PURCHASE_SERVICE_URL:http://localhost:8084}
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.supplier.url=${SUPPLIER_SERVICE_URL:http://localhost:8085}
