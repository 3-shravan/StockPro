spring.config.import=optional:file:.env[.properties]
spring.application.name=${APP_NAME:report-service}
server.port=${SERVER_PORT:8088}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Eureka Discovery
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# JPA / Hibernate (Common config)
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
# Silence standard Spring Boot open-in-view warning
spring.jpa.open-in-view=false

# JWT Configuration

# Flyway — DB Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Jackson — JSON Serialization: ISO-8601 string, not a JSON array
spring.jackson.serialization.write-dates-as-timestamps=false

# Error Handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Turn off Spring Boot startup banner
spring.main.banner-mode=off

# Logging (SLF4J + Logback)
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.apache=WARN
logging.level.com.zaxxer=WARN
logging.level.org.hibernate=WARN
logging.level.com.stockpro=INFO

# Log Formatting & Output
logging.pattern.console=%d{HH:mm:ss.SSS} %highlight(%-5level) %cyan(%logger{1}) : %msg%n
logging.pattern.file=%d{HH:mm:ss.SSS} %-5level %logger{1} : %msg%n

# Log Maintenance / Rolling Policy
logging.file.name=logs/report-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/report-service-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=50MB

# Actuator
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0

# --- Internal Service URLs ---
services.product.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.warehouse.url=${WAREHOUSE_SERVICE_URL:http://localhost:8083}
services.purchase.url=${PURCHASE_SERVICE_URL:http://localhost:8084}
services.movement.url=${MOVEMENT_SERVICE_URL:http://localhost:8086}
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Internal Gateway Security
stockpro.security.internal-secret=StockProGateway2024
