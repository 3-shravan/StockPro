spring.config.import=optional:file:.env[.properties],optional:file:services/movement-service/.env[.properties]
spring.application.name=${APP_NAME:movement-service}
server.port=${SERVER_PORT:8086}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Eureka Discovery
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jackson.serialization.write-dates-as-timestamps=false

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.main.banner-mode=off

logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.apache=WARN
logging.level.com.zaxxer=WARN
logging.level.org.hibernate=WARN
logging.level.com.stockpro=INFO

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{1} : %msg%n
logging.pattern.file=%d{HH:mm:ss.SSS} %-5level %logger{1} : %msg%n

logging.file.name=logs/movement-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/movement-service-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=50MB

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0
