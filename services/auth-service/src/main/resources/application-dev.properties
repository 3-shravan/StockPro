# ==========================================
#  Development Profile Configuration
# ==========================================

spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}

#  Flyway owns structural changes — Hibernate must not touch the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${LOCAL_JPA_SHOW_SQL:false}

#  Flyway — baseline required on first run if schema already exists
#  baseline-version=1 means: "treat V1 as already applied, don't run it"
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
