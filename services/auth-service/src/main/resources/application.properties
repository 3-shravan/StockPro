spring.config.import=optional:file:.env[.properties],optional:file:services/auth-service/.env[.properties]
spring.application.name=${APP_NAME:auth-service}
server.port=${SERVER_PORT:8081}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

#  MySQL DataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#  JPA / Hibernate (Common config)
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
# Silence standard Spring Boot open-in-view warning
spring.jpa.open-in-view=false

#  JWT Configuration
#  JWT_SECRET must be >= 32 characters; JWT_EXPIRATION in milliseconds
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

#  CORS — allowed frontend origin(s), comma-separated
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

#  Jackson — JSON Serialization: ISO-8601 string, not a JSON array
spring.jackson.serialization.write-dates-as-timestamps=false

#  Error Handling: Allow Spring MVC to throw NoHandlerFoundException (needed for our 404 handler)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

#  Logging (SLF4J + Logback)

# Turn off Spring Boot startup banner
spring.main.banner-mode=off
# Suppress all framework startup jargon completely
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.apache=WARN
logging.level.com.zaxxer=WARN
logging.level.org.hibernate=WARN

# Keep only our application logic visible
logging.level.com.stockpro=INFO

#  Log Formatting & Output (Minimalist)
logging.pattern.console=%d{HH:mm:ss.SSS} %highlight(%-5level) %cyan(%logger{1}) : %msg%n
logging.pattern.file=%d{HH:mm:ss.SSS} %-5level %logger{1} : %msg%n

#  Log Maintenance / Rolling Policy
logging.file.name=logs/auth-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/auth-service-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=50MB

#  Actuator — Health & Info endpoints only (never expose beans/env/heapdump)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0
