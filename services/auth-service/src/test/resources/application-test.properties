# ============================================================
#  Test Profile — uses H2 in-memory DB, no real MySQL needed
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

#  Disable Flyway for unit tests — H2 schema managed by Hibernate ddl-auto=create-drop
spring.flyway.enabled=false

#  JWT test values
jwt.secret=TestSecretKeyForJwtUnitTests1234567890ABCDEF
jwt.expiration=3600000

#  Suppress logging noise during tests
logging.level.root=WARN
logging.level.com.stockpro=DEBUG
