$kind: http-request
name: 2. User Login
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "shantanu@stockpro.com",
      "password": "shantanu"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.environment.set("token", jsonData.token);
      }
    language: text/javascript
order: 2000
