$kind: http-request
url: "{{base_url}}/auth/refresh"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.environment.set("token", jsonData.token);
      }
    language: text/javascript
order: 8000
