$kind: http-request
url: "{{base_url}}/auth/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "userId": 1,
      "oldPassword": "password123",
      "newPassword": "newPassword123"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 5000
